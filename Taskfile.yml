version: '3'

env:
  DOCKER_REPO: bjd145

vars:
  NPM: '{{if eq OS "windows"}}npm.cmd{{else}}npm{{end}}'

tasks:
  default:
    cmds:
      - task --list
  
  up:
    desc: Run both API and web servers in parallel
    deps:
      - run-api
      - run-web
    silent: true

  build-api:
    desc: Build the Go API
    dir: src/api
    cmds:
      - go build -o ancient-coins-api .

  openapi:
    desc: Regenerate Swagger artifacts and version annotation (writes files; no install)
    cmds:
      - node scripts/delivery/openapi.mjs

  setup:openapi:
    desc: Install the pinned Swagger generator (requires setup authorization)
    cmds:
      - GOTOOLCHAIN=local go install github.com/swaggo/swag/cmd/swag@v1.16.6

  setup:go:
    desc: Download Go dependencies using the installed toolchain (requires setup authorization)
    dir: src/api
    cmds:
      - GOTOOLCHAIN=local go mod download

  setup:web:
    desc: Install locked web dependencies (requires setup authorization)
    dir: src/web
    cmds:
      - '{{.NPM}} ci'

  setup:agent:
    desc: Prepare locked Python dev environment (requires setup authorization)
    dir: src/agent
    cmds:
      - UV_PYTHON_DOWNLOADS=never uv sync --locked --extra dev

  check:
    desc: All base completion gates; prepared tools required; OpenAPI writes files
    cmds:
      - task: check:delivery
      - task: check:go
      - task: check:web
      - task: check:agent
      - task: check:openapi

  check:go:
    desc: Go completion gate shared with CI
    dir: src/api
    cmds:
      - GOTOOLCHAIN=local GOPROXY=off go build ./...
      - GOTOOLCHAIN=local GOPROXY=off go vet ./...
      - task: test

  check:web:
    desc: Web completion gate shared with CI (no dependency installation)
    dir: src/web
    cmds:
      - '{{.NPM}} run lint'
      - '{{.NPM}} run type-check'
      - '{{.NPM}} run test'
      - '{{.NPM}} run build'

  check:agent:
    desc: Locked Python completion gate shared with CI (offline; no installation)
    dir: src/agent
    preconditions:
      - sh: test -f .venv/pyvenv.cfg
        msg: Missing prepared agent venv; obtain authorization for task setup:agent
    cmds:
      - UV_PYTHON_DOWNLOADS=never uv sync --locked --check --offline --extra dev
      - task: lint-agent
      - task: test-agent

  check:openapi:
    desc: Regenerate OpenAPI and fail on snapshot drift (writes files; no install)
    cmds:
      - node scripts/delivery/openapi.mjs --check

  check:governance:
    desc: Read-only offline active-governance consistency checks
    cmds:
      - node scripts/delivery/check-governance.mjs

  check:delivery:
    desc: Delivery guard fixtures, SpecKit regression, and offline governance check
    cmds:
      - node --test scripts/delivery/governance.test.mjs scripts/delivery/validation.test.mjs scripts/delivery/native-integration.test.mjs
      - pwsh -NoProfile -File scripts/delivery/specify.test.ps1
      - task: check:governance

  review:read-only:
    desc: Start the restricted native reviewer; requires an owner-approved scope and lease
    cmds:
      - copilot --agent aurearia-reviewer --excluded-tools sql skill {{.CLI_ARGS}}

  build-web:
    desc: Build the Vue frontend
    dir: src/web
    cmds:
      - '{{.NPM}} run build'

  run-api:
    desc: Run the Go API server
    dir: src/api
    dotenv: ['../../.env']
    cmds:
      - go run .
    env:
      DB_PATH: ./ancientcoins.db

  run-web:
    desc: Run the Vite dev server
    dir: src/web
    cmds:
      - '{{.NPM}} run dev'

  build:
    desc: Build both API and web
    deps:
      - build-api
      - build-web

  test:
    desc: Run Go architecture and unit tests
    dir: src/api
    cmds:
      - GOTOOLCHAIN=local GOPROXY=off go test -v ./...

  test-race:
    desc: Run Go tests under the race detector (requires a C toolchain)
    dir: src/api
    cmds:
      - GOTOOLCHAIN=local GOPROXY=off CGO_ENABLED=1 go test -race ./...

  test-critical-workflows:
    desc: Run F013 critical browser workflow tests
    dir: src/web
    cmds:
      - '{{.NPM}} run test:browser'

  build-agent:
    desc: Legacy setup alias (installs dependencies; NOT a validation/build gate)
    cmds:
      - task: setup:agent

  run-agent:
    desc: Run the Python agent dev server
    dir: src/agent
    dotenv: ['../../.env']
    cmds:
      - uvicorn app.main:app --host 0.0.0.0 --port 8081 --reload

  test-agent:
    desc: Run Python agent tests
    dir: src/agent
    preconditions:
      - sh: test -f .venv/pyvenv.cfg
        msg: Missing prepared agent venv; obtain authorization for task setup:agent
    cmds:
      - UV_PYTHON_DOWNLOADS=never uv run --no-sync --offline pytest tests/ -v

  lint-agent:
    desc: Lint Python agent code
    dir: src/agent
    preconditions:
      - sh: test -f .venv/pyvenv.cfg
        msg: Missing prepared agent venv; obtain authorization for task setup:agent
    cmds:
      - UV_PYTHON_DOWNLOADS=never uv run --no-sync --offline ruff check app/ tests/

  up-all:
    desc: Run API, web, and agent servers in parallel
    deps:
      - run-api
      - run-web
      - run-agent
    silent: true

  run:
    desc: Run both API and web servers in parallel
    deps:
      - run-api
      - run-web
    silent: true

  docker-build:
    desc: Build the Docker container image
    vars:
      COMMIT_SHA:
        sh: git rev-parse --short HEAD
      BUILD_DATE:
        sh: date -u +"%Y-%m-%dT%H:%M:%SZ"
    cmds:
      - docker build
        --build-arg APP_VERSION={{.COMMIT_SHA}}
        --build-arg BUILD_DATE={{.BUILD_DATE}}
        -t {{.DOCKER_REPO}}/ancient-coins:{{.COMMIT_SHA}}
        -t {{.DOCKER_REPO}}/ancient-coins:latest .

  docker-run:
    desc: Run the Docker container locally
    dotenv: ['.env']
    vars:
      COMMIT_SHA:
        sh: git rev-parse --short HEAD
    cmds:
      - docker stop ancient-coins && docker rm ancient-coins || true
      - docker run -p 8080:8080 -d
        -e JWT_SECRET=${JWT_SECRET}
        -v ancient-coins-data:/app/data
        -v ancient-coins-uploads:/app/uploads
        --name ancient-coins
        {{.DOCKER_REPO}}/ancient-coins:{{.COMMIT_SHA}}

  init:
    desc: Generate or update .env with required local secrets
    cmds:
      - |
        touch .env
        if ! grep -q '^JWT_SECRET=' .env; then
          printf 'JWT_SECRET=%s\n' "$(openssl rand -base64 48)" >> .env
        fi
        if ! grep -q '^AGENT_INTERNAL_SERVICE_TOKEN=' .env; then
          printf 'AGENT_INTERNAL_SERVICE_TOKEN=%s\n' "$(openssl rand -base64 48)" >> .env
        fi
      - echo ".env file is ready with required local secrets."
