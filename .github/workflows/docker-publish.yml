name: Build and Push to Docker Hub

on:
  workflow_run:
    workflows: [Quality Gate]
    branches: [main]
    types: [completed]

env:
  IMAGE_APP: ${{ secrets.DOCKERHUB_USERNAME }}/ancient-coins
  IMAGE_AGENT: ${{ secrets.DOCKERHUB_USERNAME }}/ancient-coins-agent

concurrency:
  group: main-publish
  cancel-in-progress: false

jobs:
  approve-release:
    name: Authorize main publish ${{ github.event.workflow_run.head_sha }}
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout checked candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.15.0
      - name: Verify candidate checks and owner approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/delivery/verify-main-publish.mjs

  build-and-push-app:
    needs: approve-release
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.15.0
      - name: Recheck publication evidence including partial reruns
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/delivery/verify-main-publish.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image tags
        id: tags
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          short_sha="${HEAD_SHA::7}"
          echo "tags=${IMAGE_APP}:sha-${HEAD_SHA},${IMAGE_APP}:sha-${short_sha},${IMAGE_APP}:latest" >> "$GITHUB_OUTPUT"

      - name: Set build date
        id: date
        run: echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push app
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            APP_VERSION=${{ github.event.workflow_run.head_sha }}
            BUILD_DATE=${{ steps.date.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-agent:
    needs: approve-release
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.15.0
      - name: Recheck publication evidence including partial reruns
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/delivery/verify-main-publish.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image tags
        id: tags
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          short_sha="${HEAD_SHA::7}"
          echo "tags=${IMAGE_AGENT}:sha-${HEAD_SHA},${IMAGE_AGENT}:sha-${short_sha},${IMAGE_AGENT}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push agent
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: src/agent
          file: src/agent/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
