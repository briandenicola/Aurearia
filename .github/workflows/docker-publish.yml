name: Build and Push to Docker Hub

# A beta -> main merge commit's second parent is the beta commit whose images
# were already built and pushed as sha-<beta commit>. Re-tag those exact images
# instead of rebuilding.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-publish
  cancel-in-progress: false

env:
  IMAGE_APP: ${{ secrets.DOCKERHUB_USERNAME }}/ancient-coins
  IMAGE_AGENT: ${{ secrets.DOCKERHUB_USERNAME }}/ancient-coins-agent

jobs:
  promote:
    name: Promote beta images to latest
    runs-on: ubuntu-latest
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Find the beta commit this merge brought in
        id: source
        run: |
          if ! beta_sha="$(git rev-parse --verify --quiet HEAD^2)"; then
            echo "::error::${GITHUB_SHA} is not a merge commit; merge beta into main with a merge commit." >&2
            exit 1
          fi
          echo "beta_sha=$beta_sha" >> "$GITHUB_OUTPUT"
          echo "Promoting images built from beta commit $beta_sha"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Re-tag app and agent images
        env:
          BETA_SHA: ${{ steps.source.outputs.beta_sha }}
          MAIN_SHA: ${{ github.sha }}
        run: |
          for image in "$IMAGE_APP" "$IMAGE_AGENT"; do
            docker buildx imagetools create \
              --tag "$image:sha-$MAIN_SHA" \
              --tag "$image:sha-${MAIN_SHA::7}" \
              --tag "$image:latest" \
              "$image:sha-$BETA_SHA"
          done
