name: Build and Push to Docker Hub

on:
  workflow_run:
    workflows: [Verified Candidate]
    branches: [main]
    types: [completed]

env:
  IMAGE_APP: ${{ secrets.DOCKERHUB_USERNAME }}/ancient-coins
  IMAGE_AGENT: ${{ secrets.DOCKERHUB_USERNAME }}/ancient-coins-agent

concurrency:
  group: main-publish
  cancel-in-progress: false

jobs:
  approve-release:
    name: Authorize main publish ${{ github.event.workflow_run.head_sha }}
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout checked candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.15.0
      - name: Verify candidate checks and owner approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/delivery/verify-main-publish.mjs

  build-and-push-app:
    name: Promote verified app image
    needs: approve-release
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.15.0
      - name: Recheck publication evidence including partial reruns
        id: evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/delivery/verify-main-publish.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download verified app receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.evidence.outputs.publisher_run_id }}
          name: beta-app-${{ steps.evidence.outputs.source_sha }}
          path: .tmp/app-receipt
      - name: Promote the immutable verified app image
        env:
          SOURCE_SHA: ${{ steps.evidence.outputs.source_sha }}
          SOURCE_TREE: ${{ steps.evidence.outputs.source_tree }}
          TARGET_IMAGE: ${{ env.IMAGE_APP }}
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/delivery/image-receipt.mjs promote app .tmp/app-receipt/image-receipt.json

  build-and-push-agent:
    name: Promote verified agent image
    needs: approve-release
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.15.0
      - name: Recheck publication evidence including partial reruns
        id: evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/delivery/verify-main-publish.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download verified agent receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.evidence.outputs.publisher_run_id }}
          name: beta-agent-${{ steps.evidence.outputs.source_sha }}
          path: .tmp/agent-receipt
      - name: Promote the immutable verified agent image
        env:
          SOURCE_SHA: ${{ steps.evidence.outputs.source_sha }}
          SOURCE_TREE: ${{ steps.evidence.outputs.source_tree }}
          TARGET_IMAGE: ${{ env.IMAGE_AGENT }}
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/delivery/image-receipt.mjs promote agent .tmp/agent-receipt/image-receipt.json
