name: Quality Gate

on:
  pull_request:
    branches: [main, beta]
  push:
    branches: [main, beta]

permissions:
  contents: read

jobs:
  delivery:
    name: Delivery governance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.protectNTFS
          GIT_CONFIG_VALUE_0: 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.15.0
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.44.0
      - name: Delivery fixtures and governance
        run: task check:delivery

  go-api:
    name: Go API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/api/go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.15.0
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.44.0
      - name: Prepare Go dependencies
        run: task setup:go
      - name: Validate Go
        run: task check:go
      - name: Install pinned OpenAPI generator
        run: task setup:openapi
      - name: Verify OpenAPI snapshot (regenerates files)
        run: task check:openapi

  go-race:
    name: Go API (race detector)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/api/go.mod

      # Runs in its own job so a data-race failure is unambiguous and does not
      # mask (or get masked by) an ordinary test failure in the go-api job.
      # The race detector requires cgo; the sqlite driver is pure Go, so this
      # is the only place CGO_ENABLED=1 is needed.
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.44.0
      - name: Prepare Go dependencies
        run: task setup:go
      - name: Validate race detector
        env:
          CGO_ENABLED: "1"
        run: task test-race

  vue-web:
    name: Vue Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install dependencies
        working-directory: src/web
        run: npm ci

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.44.0
      - name: Lint, type check, test and build
        run: task check:web

  python-agent:
    name: Python Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: src/agent
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.11.22
          uv sync --locked --extra dev

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.44.0
      - name: Locked lint and tests
        run: task check:agent
