name: Go API

on:
  pull_request:
    branches: [beta]
    paths:
      - src/api/**
      - docs/openapi.json
      - Taskfile.yml
      - .github/workflows/api.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-api:
    name: Go API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/api/go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.15.0
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.44.0
      - run: task setup:go
      - name: Build, vet, gofmt and test
        run: task check:go
      - run: task setup:openapi
      - name: OpenAPI snapshot is up to date
        run: task check:openapi
