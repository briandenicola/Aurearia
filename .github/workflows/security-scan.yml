name: Security Scan

on:
  pull_request:
    branches: [main, beta]
  push:
    branches: [main, beta]
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        if: github.event_name != 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Checkout (push diff)
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'true'

  govulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/api/go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.4.0

      - name: Run govulncheck
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./...

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          for attempt in 1 2 3; do
            npm audit --audit-level=high && exit 0
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          exit 1

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.11.22
          uv sync --locked --extra dev

      - name: Run pip-audit
        # pip-audit does not expose a portable severity threshold; fail closed
        # on any vulnerability and document temporary ignores with owner/expiry.
        run: uv run pip-audit

  agent-image-pip-check:
    name: Agent image — no pip in runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build agent image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: src/agent
          file: src/agent/Dockerfile
          push: false
          load: true
          tags: ancient-coins-agent:ci

      - name: Verify pip absent from runtime image
        # pip 25.0.1 is shipped by the python:3.12-slim base image (PYSEC-2026-3721).
        # The Dockerfile final stage removes it via 'python -m pip uninstall -y pip'.
        # The second check bypasses the venv PATH and invokes the base interpreter directly
        # so it fails on an unhardened image (system pip present) and passes only after removal.
        run: |
          if docker run --rm ancient-coins-agent:ci pip --version 2>/dev/null; then
            echo "FAIL: pip binary is still present in the runtime image" >&2
            exit 1
          fi
          if docker run --rm ancient-coins-agent:ci /usr/local/bin/python3.12 -m pip --version 2>/dev/null; then
            echo "FAIL: python -m pip is still usable via base interpreter in the runtime image" >&2
            exit 1
          fi
          echo "PASS: pip is not accessible in the runtime image"

      - name: Smoke-test /health endpoint
        # Starts the already-built image on a random loopback port, polls GET /health
        # (no auth -- PUBLIC_PATHS in security.py), and always removes the exact container.
        run: |
          CID=$(docker run -d -p 127.0.0.1::8081 ancient-coins-agent:ci)
          trap 'docker rm -f "$CID" >/dev/null 2>&1' EXIT
          PORT=$(docker port "$CID" 8081/tcp | awk -F: '{print $NF}')
          TIMEOUT=30
          ELAPSED=0
          until curl -sf "http://127.0.0.1:${PORT}/health" >/dev/null 2>&1; do
            sleep 1
            ELAPSED=$((ELAPSED + 1))
            if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
              echo "FAIL: /health did not respond within ${TIMEOUT}s" >&2
              docker logs "$CID" >&2
              exit 1
            fi
          done
          BODY=$(curl -sf "http://127.0.0.1:${PORT}/health")
          echo "PASS: /health returned 200 -- response: $BODY"

  container-security:
    name: Container security (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            context: .
            file: Dockerfile
            image: ancient-coins-app:security
            archive: ancient-coins-app-oci
            bundle: ancient-coins-app.tar
          - name: agent
            context: src/agent
            file: src/agent/Dockerfile
            image: ancient-coins-agent:security
            archive: ancient-coins-agent-oci
            bundle: ancient-coins-agent.tar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build image with SBOM and provenance
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          tags: ${{ matrix.image }}
          outputs: type=oci,dest=/tmp/${{ matrix.archive }},tar=false
          sbom: true
          provenance: mode=max

      - name: Scan image for High and Critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          input: /tmp/${{ matrix.archive }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Generate image SBOM
        uses: anchore/sbom-action@006b7ce8314066bdf1765b4500370d40fa6917a3 # v0.24.2
        with:
          image: oci-dir:/tmp/${{ matrix.archive }}
          artifact-name: feature362-${{ matrix.name }}.spdx.json
          output-file: /tmp/feature362-${{ matrix.name }}.spdx.json
          format: spdx-json
          upload-artifact-retention: 30
          upload-release-assets: false

      - name: Archive OCI image and attestations
        run: tar -C /tmp -cf /tmp/${{ matrix.bundle }} ${{ matrix.archive }}

      - name: Attest image archive provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: /tmp/${{ matrix.bundle }}
