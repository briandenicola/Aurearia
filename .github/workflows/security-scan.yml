name: Security Scan

on:
  pull_request:
    branches: [main, beta]
  push:
    branches: [main, beta]
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        if: github.event_name != 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Checkout (push diff)
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'true'

  govulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/api/go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.4.0

      - name: Run govulncheck
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./...

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.11.22
          uv sync --locked --extra dev

      - name: Run pip-audit
        # pip-audit does not expose a portable severity threshold; fail closed
        # on any vulnerability and document temporary ignores with owner/expiry.
        run: uv run pip-audit

  agent-image-pip-check:
    name: Agent image — no pip in runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build agent image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: src/agent
          file: src/agent/Dockerfile
          push: false
          load: true
          tags: ancient-coins-agent:ci

      - name: Verify pip absent from runtime image
        # pip 25.0.1 is shipped by the python:3.12-slim base image (PYSEC-2026-3721).
        # The Dockerfile final stage removes it via 'python -m pip uninstall -y pip'.
        # The second check bypasses the venv PATH and invokes the base interpreter directly
        # so it fails on an unhardened image (system pip present) and passes only after removal.
        run: |
          if docker run --rm ancient-coins-agent:ci pip --version 2>/dev/null; then
            echo "FAIL: pip binary is still present in the runtime image" >&2
            exit 1
          fi
          if docker run --rm ancient-coins-agent:ci /usr/local/bin/python3.12 -m pip --version 2>/dev/null; then
            echo "FAIL: python -m pip is still usable via base interpreter in the runtime image" >&2
            exit 1
          fi
          echo "PASS: pip is not accessible in the runtime image"

      - name: Smoke-test /health endpoint
        # Starts the already-built image on a random loopback port, polls GET /health
        # (no auth -- PUBLIC_PATHS in security.py), and always removes the exact container.
        run: |
          CID=$(docker run -d -p 127.0.0.1::8081 ancient-coins-agent:ci)
          trap 'docker rm -f "$CID" >/dev/null 2>&1' EXIT
          PORT=$(docker port "$CID" 8081/tcp | awk -F: '{print $NF}')
          TIMEOUT=30
          ELAPSED=0
          until curl -sf "http://127.0.0.1:${PORT}/health" >/dev/null 2>&1; do
            sleep 1
            ELAPSED=$((ELAPSED + 1))
            if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
              echo "FAIL: /health did not respond within ${TIMEOUT}s" >&2
              docker logs "$CID" >&2
              exit 1
            fi
          done
          BODY=$(curl -sf "http://127.0.0.1:${PORT}/health")
          echo "PASS: /health returned 200 -- response: $BODY"
