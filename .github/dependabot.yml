version: 2
updates:
  - package-ecosystem: gomod
    directory: /src/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go
    groups:
      gomod-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /src/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    ignore:
      - dependency-name: vite
        versions: [">=8.0.0"]
      - dependency-name: typescript
        versions: [">=6.0.0"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /src/agent
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    groups:
      uv-minor-patch:
        update-types: [minor, patch]
