openapi: 3.0.3
info:
  title: Feature 363 Wishlist Action Excerpt
  version: 1.0.0
  description: >
    Normative excerpt for explicit staging and confirmed wishlist creation.
    The repository-generated OpenAPI remains authoritative for the complete API.
paths:
  /api/collector/wishlist-actions/stages:
    post:
      operationId: stageCollectorWishlistAction
      summary: Stage an eligible Coin Copilot market result for owner review
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageRequest'
      responses:
        '201':
          description: Immutable stage created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stage'
        '200':
          description: Same-owner same-fingerprint idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stage'
        '400': {description: Malformed, unsupported, stale, unsafe, or ineligible result}
        '404': {description: Unknown or foreign source run/result}
        '409': {description: Idempotency mismatch or duplicate requiring review}
        '410': {description: Source evidence no longer retained}
        '413': {description: Request exceeds bound}
        '503': {description: Feature unavailable; no write}
  /api/collector/wishlist-actions/stages/{stageId}/confirm:
    post:
      operationId: confirmCollectorWishlistAction
      summary: Confirm an exact stage and create one owner-scoped wishlist item
      security:
        - bearerAuth: []
      parameters:
        - name: stageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRequest'
      responses:
        '200':
          description: Created or stable idempotent existing outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmOutcome'
        '400': {description: Invalid confirmation}
        '404': {description: Unknown or foreign stage}
        '409': {description: Version, fingerprint, idempotency, eligibility, or duplicate conflict}
        '410': {description: Stage expired or source evidence unavailable}
        '503': {description: Feature unavailable; no write}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9._~-]+$'
  schemas:
    MarketKind:
      type: string
      enum: [dealer_listing, auction_lot]
    Confidence:
      type: string
      enum: [low, medium, high]
    StageRequest:
      type: object
      additionalProperties: false
      required:
        - marketKind
        - runId
        - executionId
        - toolCallId
        - canonicalSourceId
        - resultDigest
      properties:
        marketKind:
          $ref: '#/components/schemas/MarketKind'
        runId:
          type: string
          minLength: 1
          maxLength: 128
        executionId:
          type: string
          minLength: 1
          maxLength: 128
        toolCallId:
          type: string
          minLength: 1
          maxLength: 128
        canonicalSourceId:
          type: string
          format: uri
          maxLength: 2048
        resultDigest:
          type: string
          pattern: '^[a-f0-9]{64}$'
    Stage:
      type: object
      additionalProperties: false
      required:
        - id
        - version
        - marketKind
        - source
        - mapping
        - omittedFields
        - evidence
        - duplicateWarnings
        - limitations
        - requestFingerprint
        - expiresAt
      properties:
        id: {type: string, format: uuid}
        version: {type: integer, enum: [1]}
        marketKind: {$ref: '#/components/schemas/MarketKind'}
        source:
          type: object
          additionalProperties: false
          required: [provider, sourceUrl, observedAt, confidence, verificationState]
          properties:
            provider: {type: string, minLength: 1, maxLength: 64}
            sourceUrl: {type: string, format: uri, maxLength: 2048}
            observedAt: {type: string, format: date-time}
            confidence: {$ref: '#/components/schemas/Confidence'}
            verificationState:
              type: string
              enum: [verified, partial, unverified]
            listingState:
              type: string
              nullable: true
              enum: [available, upcoming, active, sold, unavailable, ended, unknown]
            price: {type: number, nullable: true, minimum: 0, maximum: 100000000}
            currency:
              type: string
              nullable: true
              pattern: '^[A-Z]{3}$'
        mapping:
          type: object
          additionalProperties: false
          required: [name, isWishlist]
          properties:
            name: {type: string, minLength: 1, maxLength: 300}
            denomination: {type: string, nullable: true, maxLength: 100}
            ruler: {type: string, nullable: true, maxLength: 200}
            era: {type: string, nullable: true, maxLength: 100}
            mint: {type: string, nullable: true, maxLength: 200}
            material: {type: string, nullable: true, maxLength: 100}
            grade: {type: string, nullable: true, maxLength: 100}
            referenceUrl: {type: string, format: uri, maxLength: 2048}
            currentValue: {type: number, nullable: true, minimum: 0, maximum: 100000000}
            listingStatus: {type: string, nullable: true}
            isWishlist: {type: boolean, enum: [true]}
        omittedFields:
          type: array
          maxItems: 30
          items: {type: string, maxLength: 64}
        evidence:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [field, sourceUrl, observedAt, confidence, verificationState]
            properties:
              field: {type: string, maxLength: 64}
              sourceUrl: {type: string, format: uri, maxLength: 2048}
              observedAt: {type: string, format: date-time}
              confidence: {$ref: '#/components/schemas/Confidence'}
              verificationState: {type: string, enum: [verified, partial, unverified]}
        duplicateWarnings:
          type: array
          maxItems: 10
          items: {type: string, maxLength: 500}
        limitations:
          type: array
          maxItems: 10
          items: {type: string, maxLength: 500}
        requestFingerprint:
          type: string
          pattern: '^[a-f0-9]{64}$'
        expiresAt: {type: string, format: date-time}
    ConfirmRequest:
      type: object
      additionalProperties: false
      required: [stageVersion, requestFingerprint, confirmation]
      properties:
        stageVersion: {type: integer, enum: [1]}
        requestFingerprint:
          type: string
          pattern: '^[a-f0-9]{64}$'
        confirmation:
          type: string
          enum: [confirm_add_to_wishlist]
    ConfirmOutcome:
      type: object
      additionalProperties: false
      required: [outcome, stageId, coinId, confirmedAt, replayed]
      properties:
        outcome: {type: string, enum: [created, existing]}
        stageId: {type: string, format: uuid}
        coinId: {type: integer, minimum: 1}
        confirmedAt: {type: string, format: date-time}
        replayed: {type: boolean}
