<meta name="description" content="LUCANIA, Thourioi. Circa 443-400 BC. AR Nomos (20mm, 7.12 g, 3h). Head of Athena right, wearing crested Attic helmet adorned with laurel wreath / Bull standing right, with head lowered; in exergue, fish swimming right. Jörgensen 8; HN Italy 1775; SNG ANS 900–14. Attractively toned, slight die wear. EF. Struck in high relief from dies of fine style. From the Style Collection. Ex Classical Numismatic Group 106 (13 September 2017), lot 20; CNG Inventory 903233 (August 2011); George J. Bauer Collection (Numismatic Fine Arts [E. Gans] 16, 19 April 1960), lot 75.This nomos, one of the first silver issues of Thourioi, is a fine example of early classical art as it developed in Magna Graecia. Athena has a stern, almost disdainful expression, reflecting Thourioi’s war footing with its neighboring rival of Tarentum. Her Attic-style helmet, crested with horsehair, is also adorned with a laurel wreath, signifying victory (although the long war with Tarentum seems to have ended in a draw).  Closing Date and Time: 20 November 2019 at 10:00:00 ET.Winning bids are subject to a 20% buyer&#039;s fee for bids placed on this website, 22.50% for all others." />
